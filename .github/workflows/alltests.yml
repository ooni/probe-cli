# Runs the whole test suite
name: alltests
on:
  pull_request:
  push:
    branches:
      - "release/**"
      - "fullbuild"
      - "alltestsbuild"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: make userauth

      - run: go test -race -tags shaping ./...
