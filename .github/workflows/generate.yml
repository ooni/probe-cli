# Verifies that `go generate ./...` is not broken
name: generate
on:
  push:
    branches:
      - "release/**"
      - "fullbuild"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go generate ./...
